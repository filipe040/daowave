name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      
      - name: Install dependencies
        run: npm ci
        working-directory: .
      
      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: .
      
      - name: Build
        run: npm run build
        working-directory: .
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-key-for-ci-testing-only-min-32-chars
          NEXTAUTH_URL: http://localhost:3000
          QR_SECRET: test-qr-secret-key-for-ci-testing-only-min-32-chars
